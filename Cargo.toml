[workspace]
resolver = "3"
members = [
    "crates/fsrs-core",
    "crates/fsrs-ai",
    "crates/fsrs-acp",
    "crates/fsrs-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Githab-capibara <rrrarrr37r@gmail.com>"]
repository = "https://github.com/Githab-capibara/fs-rs"

[workspace.dependencies]
fsrs-core = { path = "crates/fsrs-core" }
fsrs-ai = { path = "crates/fsrs-ai" }
fsrs-acp = { path = "crates/fsrs-acp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
