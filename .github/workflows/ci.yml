name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The Ghostty VT engine that `egui_tty` embeds is built by `zig build`, so
  # every job that compiles the workspace installs the pinned toolchain first.
  # The version is the one the vendored ghostty source is known to build with.
  #
  # The toolchain is fetched from the official release channel rather than
  # through `mlugg/setup-zig`: that action asks the mirrors for an index under
  # `https://ziglang.org/builds`, which serves only the development channel,
  # and fails with a 404. The release channel lives under
  # `https://ziglang.org/download/<version>/`.

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig 0.15.2
        run: |
          for attempt in 1 2 3; do
            curl -fsSL -o /tmp/zig.tar.xz \
              https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
              && break
            echo "download failed (attempt ${attempt}), retrying"
            sleep 5
          done
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          "$HOME/.zig/zig" version
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig 0.15.2
        run: |
          for attempt in 1 2 3; do
            curl -fsSL -o /tmp/zig.tar.xz \
              https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
              && break
            echo "download failed (attempt ${attempt}), retrying"
            sleep 5
          done
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          "$HOME/.zig/zig" version
      - run: cargo test --workspace
        # The integration tests that need a running agent or a running decision
        # model skip themselves when it is absent, so the suite stays green on
        # a bare runner.

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-docs.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The repository carries `deny.toml`: an explicit allow list of
          # licences and a documented ignore list for the unmaintained
          # advisories of the accessibility stack.
