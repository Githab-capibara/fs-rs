<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Distribution of the criticality and the complexity of the rated upstream commits">
  <title>Ratings of 60 upstream commits by the local Foq decision model</title>
  <style>
    .chart-title { font: 600 17px system-ui, sans-serif; fill: #1b1f24; }
    .chart-sub { font: 400 12px system-ui, sans-serif; fill: #6b7280; }
    .legend { font: 400 12px system-ui, sans-serif; fill: #374151; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
    <text x="200" y="64" class="chart-title" text-anchor="middle">Criticality</text>
    <text x="200" y="82" class="chart-sub" text-anchor="middle">60 commits</text>
    <path d="M 200.00 90.00 A 120.00 120.00 0 0 1 224.95 92.62 L 217.88 125.88 A 86.00 86.00 0 0 0 200.00 124.00 Z" fill="#e0662a"><title>High: 2</title></path>
    <path d="M 224.95 92.62 A 120.00 120.00 0 1 1 85.87 247.08 L 118.21 236.58 A 86.00 86.00 0 1 0 217.88 125.88 Z" fill="#e8b923"><title>Medium: 40</title></path>
    <path d="M 85.87 247.08 A 120.00 120.00 0 0 1 175.05 92.62 L 182.12 125.88 A 86.00 86.00 0 0 0 118.21 236.58 Z" fill="#4f9d69"><title>Low: 16</title></path>
    <path d="M 175.05 92.62 A 120.00 120.00 0 0 1 200.00 90.00 L 200.00 124.00 A 86.00 86.00 0 0 0 182.12 125.88 Z" fill="#8a8f98"><title>Trivial: 2</title></path>
    <rect x="346" y="93" width="12" height="12" rx="3" fill="#e0662a"/>
    <text x="364" y="103" class="legend">High — 2 (3%)</text>
    <rect x="346" y="115" width="12" height="12" rx="3" fill="#e8b923"/>
    <text x="364" y="125" class="legend">Medium — 40 (67%)</text>
    <rect x="346" y="137" width="12" height="12" rx="3" fill="#4f9d69"/>
    <text x="364" y="147" class="legend">Low — 16 (27%)</text>
    <rect x="346" y="159" width="12" height="12" rx="3" fill="#8a8f98"/>
    <text x="364" y="169" class="legend">Trivial — 2 (3%)</text>
    <text x="560" y="64" class="chart-title" text-anchor="middle">Complexity</text>
    <text x="560" y="82" class="chart-sub" text-anchor="middle">60 commits</text>
    <path d="M 560.00 90.00 A 120.00 120.00 0 0 1 680.00 210.00 L 646.00 210.00 A 86.00 86.00 0 0 0 560.00 124.00 Z" fill="#4f9d69"><title>Medium: 15</title></path>
    <path d="M 680.00 210.00 A 120.00 120.00 0 1 1 560.00 90.00 L 560.00 124.00 A 86.00 86.00 0 1 0 646.00 210.00 Z" fill="#8ab04a"><title>Easy: 45</title></path>
    <rect x="706" y="93" width="12" height="12" rx="3" fill="#4f9d69"/>
    <text x="724" y="103" class="legend">Medium — 15 (25%)</text>
    <rect x="706" y="115" width="12" height="12" rx="3" fill="#8ab04a"/>
    <text x="724" y="125" class="legend">Easy — 45 (75%)</text>
</svg>
