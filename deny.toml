# Configuration of cargo-deny — see https://embarkstudios.github.io/cargo-deny/
#
# The file is explicit on purpose: without it every crate is rejected, so the
# allow list below is the audited set of licences that the workspace and its
# dependencies use. Run it with:
#
#     cargo deny check

[advisories]
# The RustSec database flags the D-Bus stack of the accessibility layer as
# unmaintained. Those advisories are "no longer maintained" notices, not
# vulnerabilities: the crates work, but their upstream folded them into
# `zbus` 6. They reach us only transitively, through
# eframe → accesskit_unix → atspi → zbus, and the accessibility support of the
# GUI cannot be dropped.
#
# The list below is exact: when a new advisory appears — for these crates or
# for any other — the check fails and has to be reviewed by hand.
ignore = [
    # zvariant — merged into `zbus` 6 as the `wire` module.
    "RUSTSEC-2026-0370",
    # zbus_names — merged into `zbus` 6 as the `names` module.
    "RUSTSEC-2026-0371",
    # zvariant_derive — derive macros moved into `zbus` 6.
    "RUSTSEC-2026-0372",
]

[licenses]
# Every licence used by the workspace and by its dependencies, as reported by
# `cargo metadata`. Anything outside this list fails the check.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# The GUI stack of egui and winit ships duplicate versions of shared
# crates (`windows-sys`, `hashbrown`, `bitflags`, …): different subsystems
# pin different versions upstream, and the workspace cannot fix that
# without patching dependencies it does not own. Report them, but do not
# fail the build on them.
multiple-versions = "warn"

[sources]
# Only the public crates.io index and the explicit path dependencies of the
# workspace are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
